name: Build

# Builds NNBuild for six platforms. A release tag ("n" or "v" followed by the
# version number, such as n1.0.0) also publishes the archives as a GitHub release.

on:
  push:
    branches: [multiplayer]
    tags: ['n[0-9]*', 'v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm pkg-config \
            libsdl2-dev libflac-dev libogg-dev libvpx-dev libcurl4-openssl-dev \
            libgl1-mesa-dev libglu1-mesa-dev libasound2-dev
      - name: Build
        # FLAC and VPX are linked statically: their library names differ
        # between distributions, and the archive should run on all of them.
        run: |
          make -j"$(nproc)" nnbuild PRETTY_OUTPUT=0 \
            FLAC_LIBS="-l:libFLAC.a -l:libogg.a" VPX_LIBS="-l:libvpx.a"
      - name: Smoke test
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./nnbuild --help
      - name: Build the lobby program
        # The lobby server on its own, for machines that only keep the list.
        # The same library options as the game, so nothing is compiled twice.
        # The lobby uses none of those libraries and ends up without them.
        run: |
          make -j"$(nproc)" nnbuild-lobby PRETTY_OUTPUT=0 \
            FLAC_LIBS="-l:libFLAC.a -l:libogg.a" VPX_LIBS="-l:libvpx.a"
          ./nnbuild-lobby --help
          ldd ./nnbuild-lobby
      - name: Package
        run: |
          case "$GITHUB_REF" in refs/tags/[nv][0-9]*) export NNBUILD_VERSION="${GITHUB_REF_NAME#[nv]}" ;; esac
          sh platform/package.sh linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: nnbuild-linux-${{ matrix.arch }}
          path: dist/nnbuild-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    # Cross-compiled with MinGW-w64; the Windows libraries are in platform/Windows.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, triple: x86_64-w64-mingw32, package: x86-64 }
          - { arch: x86, triple: i686-w64-mingw32, package: i686 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make nasm zip g++-mingw-w64-${{ matrix.package }}-posix
          sudo update-alternatives --set ${{ matrix.triple }}-gcc /usr/bin/${{ matrix.triple }}-gcc-posix
          sudo update-alternatives --set ${{ matrix.triple }}-g++ /usr/bin/${{ matrix.triple }}-g++-posix
      - name: Build
        run: make -j"$(nproc)" PLATFORM=WINDOWS CROSS=${{ matrix.triple }}- nnbuild PRETTY_OUTPUT=0
      - name: Package
        run: |
          case "$GITHUB_REF" in refs/tags/[nv][0-9]*) export NNBUILD_VERSION="${GITHUB_REF_NAME#[nv]}" ;; esac
          sh platform/package.sh windows-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: nnbuild-windows-${{ matrix.arch }}
          path: dist/nnbuild-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15, min_os: '15.0' }
          - { arch: x64, runner: macos-15-intel, min_os: '14.0' }
    env:
      # Matches the Homebrew libraries on each runner, which set the real limit.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.min_os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: brew install sdl2 flac libogg libvpx dylibbundler
      - name: Build
        # -k: report every compile error in one run, not just the first.
        run: make -k -j"$(sysctl -n hw.ncpu)" nnbuild PRETTY_OUTPUT=0
      - name: Smoke test
        run: ./nnbuild --help
      - name: Package
        run: |
          case "$GITHUB_REF" in refs/tags/[nv][0-9]*) export NNBUILD_VERSION="${GITHUB_REF_NAME#[nv]}" ;; esac
          sh platform/package.sh macos-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: nnbuild-macos-${{ matrix.arch }}
          path: dist/nnbuild-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          curl -sSfL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin
      - name: Build the site
        run: mdbook build docs
      - uses: actions/upload-artifact@v4
        with:
          name: nnbuild-docs
          path: docs/book
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: nnbuild-*-*
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l artifacts
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NNBuild ${GITHUB_REF_NAME#[nv]}" \
            --latest \
            --notes-file docs/release-notes.md \
            artifacts/nnbuild-linux-*.tar.gz artifacts/nnbuild-windows-*.zip artifacts/nnbuild-macos-*.zip
