# nginx site for the host name of the public NNBuild lobby.
#
# The lobby itself speaks UDP on port 23519 and does not go through nginx; pm2
# runs it as "NNBuildLobby" (see deploy-lobby.sh). This site only gives the host
# name an answer on the web: every request is sent on to the documentation.
#
# Install as /etc/nginx/sites-available/nnb.ms.nukemnet.com, link it into
# sites-enabled, then let certbot add the HTTPS part:
#   certbot --nginx -d nnb.ms.nukemnet.com

server {
    listen 80;
    listen [::]:80;
    server_name nnb.ms.nukemnet.com;

    location / {
        return 302 https://nnb.nukemnet.com/multiplayer/lobby-server.html;
    }
}
