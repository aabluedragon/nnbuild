# nginx site for the NNBuild documentation (static files built by mdBook).
# Install as /etc/nginx/sites-available/nnb.nukemnet.com, link it into
# sites-enabled, then let certbot add the HTTPS part:
#   certbot --nginx -d nnb.nukemnet.com

server {
    listen 80;
    listen [::]:80;
    server_name nnb.nukemnet.com;

    root /var/www/nnb.nukemnet.com;
    index index.html;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # mdBook puts a content hash in these file names, so they can be cached.
    location ~* \.(?:css|js|woff2?|png|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    add_header X-Content-Type-Options nosniff;
}
